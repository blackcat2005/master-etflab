[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etflab"
version = "0.2.0"
description = "PDF -> JSON -> chunks -> hybrid retrieval cho bao cao tai chinh ETF Viet Nam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 1: hybrid retrieval (vector side). BM25 khong can dependency.
retrieval = [
    "sentence-transformers>=3.0",
]
# Script tao gold page can doc text layer PDF; parser hinh hoc da luu tru.
eval = [
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]